# Deploy on push to main. Needs repo secret CLOUDFLARE_API_TOKEN
# (Cloudflare "Edit Cloudflare Workers" token).
#
# Do not put YNAB_ACCESS_TOKEN or AUTH_PASSPHRASE in GitHub. Set those on
# the Worker; they persist across deploys.
#
# Delete this file if Cloudflare Workers Builds already deploys on push.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
